name: Release

# Push a tag matching the version in package.json (for example v0.5.0) to publish it.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Git identity for the test repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: npm test
      - run: npx --yes @vscode/vsce package --out source-control-graph-plus.vsix
      # The Source Control Graph menu is a proposed API: it only shows where VS Code allows it,
      # the other entry points work everywhere.
      # Marketplace Trusted Publishing: GitHub's OIDC token replaces a stored PAT. Needs a policy for
      # this repository and release.yml on the publisher's Trusted Publishing page.
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --oidc --packagePath source-control-graph-plus.vsix --allow-proposed-apis contribSourceControlHistoryItemMenu
      # Open VSX Trusted Publishing, same idea: needs this repository and release.yml as a trusted
      # publisher in the namespace settings on open-vsx.org.
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing source-control-graph-plus.vsix
      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" source-control-graph-plus.vsix --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
